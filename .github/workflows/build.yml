---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 6 * * *'  # 06:30 UTC daily, to pick up base image updates
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push ${{ matrix.image.name }} (${{ matrix.platform }})
    # Each platform builds natively on its own runner (no QEMU); the manifest job joins them into one multi-arch tag
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        image:
          # Each entry builds Containerfile with VARIANT=<variant>: build_files/common + build_files/<variant>
          # Keep the names in sync with the manifest job's matrix
          - name: ozcore-hci
            variant: hci
            description: "uCore HCI NAS image with iSCSI target and Materia"
          - name: ozcore-minimal
            variant: minimal
            description: "Minimal uCore NAS image with Materia"

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      IMAGE_NAME: ${{ matrix.image.name }}
      IMAGE_DESC: ${{ matrix.image.description }}

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mount BTRFS for podman storage
        uses: ublue-os/container-storage-action@dc1f4c8f17b672069e921f001132f7cf98a423a6 # main

      - name: Get current date
        id: date
        run: |
          # RFC 3339 UTC timestamp for org.opencontainers.image.created, e.g. 2022-02-08T15:38:15Z
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Image Metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          # Per-platform tag only (e.g. latest-arm64); the multi-arch tags are generated in the manifest job
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}-${{ matrix.platform }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/main/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VARIANT=${{ matrix.image.variant }}
          oci: false

      # Only main publishes; PR builds stop after building the image
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Export digest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "${{ steps.push.outputs.digest }}" > "${RUNNER_TEMP}/digests/${{ matrix.platform }}"

      - name: Upload digest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.platform }}-${{ env.IMAGE_NAME }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # Long enough to re-run the sbom job for a past build, which needs these digests
          retention-days: 7

  manifest:
    name: Publish and sign ${{ matrix.image_name }} manifest
    needs: build_push
    # Only main publishes; PR builds stop after building the image
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        image_name: [ozcore-hci, ozcore-minimal]

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      IMAGE_NAME: ${{ matrix.image_name }}

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*-${{ env.IMAGE_NAME }}  # platform first, so an image name that prefixes another (e.g. ozcore / ozcore-minimal) can't match both
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Image Metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          # Multi-arch tags: "$DEFAULT_TAG", "$DEFAULT_TAG.$date" and "$date"
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
          sep-tags: " "

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-arch manifest
        id: push
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          buildah manifest create "${IMAGE_NAME}"
          for platform in amd64 arm64; do
            # Fails if a platform's digest is missing, so a partial manifest is never published
            buildah manifest add "${IMAGE_NAME}" "docker://${IMAGE_FULL}@$(cat "${RUNNER_TEMP}/digests/${platform}")"
          done
          for tag in ${{ steps.metadata.outputs.tags }}; do
            buildah manifest push --format v2s2 --digestfile "${RUNNER_TEMP}/manifest-digest" \
              "${IMAGE_NAME}" "docker://${IMAGE_FULL}:${tag}"
          done
          echo "digest=$(cat "${RUNNER_TEMP}/manifest-digest")" >> "${GITHUB_OUTPUT}"

      # Signed with the SIGNING_SECRET repo secret; hosts verify against cosign.pub (see 10-signing.sh)
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign container image
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          # Sign the manifest list and each platform image: podman/bootc verify the platform image they
          # actually pull, cosign verify checks the list. Signing digests covers every tag pointing at them.
          for digest in ${{ steps.push.outputs.digest }} $(cat "${RUNNER_TEMP}"/digests/*); do
            # Legacy (.sig tag) format: podman/bootc can't verify cosign v3's new bundle format yet
            cosign sign -y --new-bundle-format=false --use-signing-config=false \
              --key env://COSIGN_PRIVATE_KEY "${IMAGE_FULL}@${digest}"
          done
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

  sbom:
    name: SBOM for ${{ matrix.image_name }} (${{ matrix.platform }})
    # Runs after images are published and signed, so a failure here never holds back a release
    needs: manifest
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        image_name: [ozcore-hci, ozcore-minimal]
        platform: [amd64, arm64]

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ${{ matrix.image_name }}

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Download digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.platform }}-${{ env.IMAGE_NAME }}
          path: ${{ runner.temp }}/digests

      - name: Read digest
        run: echo "DIGEST=$(cat "${RUNNER_TEMP}/digests/${{ matrix.platform }}")" >> "${GITHUB_ENV}"

      # One SBOM per platform image: package builds differ between amd64 and arm64
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # registry: scans the published digest directly instead of looking for a local daemon image
          image: registry:${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ env.DIGEST }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          # renovate: datasource=github-releases depName=anchore/syft
          syft-version: v1.57.1

      - name: Report SBOM size
        run: |
          echo "SBOM: $(du -h "${RUNNER_TEMP}/sbom.spdx.json" | cut -f1), $(jq '.packages | length' "${RUNNER_TEMP}/sbom.spdx.json") packages"

      # Before attesting, so the SBOM is kept even if attaching it fails
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-${{ env.IMAGE_NAME }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/sbom.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Attach signed SBOM attestation
        run: |
          # Same key and legacy format as the image signatures; verify with
          # cosign verify-attestation --key cosign.pub --type spdxjson <image>@<platform digest>
          cosign attest -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY --type spdxjson \
            --predicate "${RUNNER_TEMP}/sbom.spdx.json" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
