---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      image-name:
        description: "Image variant"
        required: true
        default: ucore-nas
        type: choice
        options:
          - ucore-nas
          - ucore-nas-minimal
      platform:
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/disk.toml'
      - 'disk_config/iso.toml'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ inputs.image-name || 'ucore-nas' }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "ghcr.io/osbuild/bootc-image-builder:v91.0.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    # Stays on 24.04: on 26.04 bootc-image-builder can't mount its container storage (permission denied)
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          {
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "IMAGE_NAME=${IMAGE_NAME,,}"
            echo "DISK_TYPE=${DISK_TYPE}"
            echo "USER_UID=${USER_UID}"
            echo "USER_GID=${USER_GID}"
          } >> "${GITHUB_ENV}"

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Point installer at the selected image
        if: matrix.disk-type == 'anaconda-iso'
        run: |
          sed -i "s#ghcr.io/thewizardofozolins/ucore-nas:latest#${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}#" ./disk_config/iso.toml
          grep 'bootc switch' ./disk_config/iso.toml

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@028e4d28330efe546229eb9cb52aee78174d2347 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True --rootfs xfs

      - name: Upload disk images and Checksum to Job Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # One artifact per disk type; unnamed, the qcow2 and ISO jobs would overwrite each other
          name: ${{ env.IMAGE_NAME }}-${{ matrix.disk-type }}-${{ inputs.platform }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
